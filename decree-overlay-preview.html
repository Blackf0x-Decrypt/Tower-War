<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>Decree overlay preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #a3ce57;
      color: #fffbea;
    }
    .preview-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px 24px;
    }
    .battle-card {
      position: relative;
      height: 720px;
      border: 5px solid #ffdda0;
      border-radius: 24px;
      box-shadow: 0 7px 0 #94713b, 0 12px 24px #405e3030;
      background: #fff3d5;
      overflow: hidden;
    }
    .battlefield {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #9fcf48;
      overflow: hidden;
    }
    .world-map {
      position: absolute;
      inset: 0;
      background: #a9d950 linear-gradient(135deg, #b8e05a 0%, #8fc43f 50%, #a9d950 100%);
    }
    .map-caption {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 2;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fffbe5;
      text-shadow: 0 1px 3px #3b512a;
    }
    .map-caption span { opacity: 0.85; font-weight: 600; margin-left: 6px; }
    .fake-tower {
      position: absolute;
      width: 72px;
      height: 92px;
      border-radius: 12px 12px 8px 8px;
      background: linear-gradient(#e8c98a, #c9954a);
      border: 3px solid #8d6032;
      box-shadow: 0 4px 0 #6b442b;
    }
    .fake-tower::after {
      content: attr(data-n);
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      min-width: 36px;
      padding: 2px 8px;
      border-radius: 8px;
      background: #fff8e8;
      color: #6b442b;
      font-weight: 900;
      font-size: 18px;
      border: 2px solid #e8c98a;
    }
    .t1 { left: 18%; top: 28%; }
    .t2 { left: 42%; top: 52%; }
    .t3 { left: 68%; top: 22%; }
    .t4 { left: 78%; top: 58%; }

    /* From app/globals.css — decree overlay block */
    .decree-overlay{position:absolute;inset:0;z-index:195;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:#1f3018c9;pointer-events:auto}
    .decree-overlay-card{width:min(920px,100%);max-height:min(88dvh,100%);overflow:auto;padding:16px 18px;border:3px solid #ffe4ac;border-bottom:6px solid #8d6032;border-radius:20px;background:#fff3d5f2;color:#5c4328;box-shadow:0 12px 32px #1c331050}
    .decree-overlay-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
    .decree-overlay-head h2{margin:0;font-size:clamp(17px,3.5vw,22px);color:#6b442b;flex:1}
    .decree-overlay-timer{margin-left:auto;font-weight:900;font-size:15px;padding:6px 10px;border-radius:10px;background:#f7dba2;border:2px solid #e8c07a;color:#6b442b}
    .decree-overlay-lead{margin:0 0 12px;font-size:13px;line-height:1.45;color:#7a5a38}
    .decree-candidates--overlay{display:flex;flex-direction:column;gap:10px;width:100%}
    .decree-candidates--overlay .decree-candidate{width:100%;box-sizing:border-box}
    .decree-candidate{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 13px;min-height:42px;border:2px solid #e8c98a;border-bottom:4px solid #a67a45;border-radius:14px;background:#fff8e8;color:#5c4328;font:inherit;cursor:pointer}
    .decree-candidate b{font-size:14px;color:#6b442b}
    .decree-candidate small{font-size:11px;color:#8a6845;font-style:italic}
    .decree-candidate span{font-size:12px;font-weight:800;color:#3f6b2f}
    .decree-candidate em{font-size:11px;color:#7a5a38;font-style:normal;line-height:1.35}
    .decree-candidate--custom{background:#f7e6c8;border-color:#dca957}
    .decree-overlay-foot{margin-top:12px;font-size:11px;color:#7a5a38}
    .eyebrow{display:block;letter-spacing:1.5px;font-size:10px;font-weight:750;color:#a47a45}
  </style>
</head>
<body>
  <div class="preview-shell">
    <div class="battle-card">
      <div class="battlefield">
        <div class="world-map">
          <div class="map-caption">СОЛНЕЧНАЯ ДОЛИНА <span>36° N · 24° E</span></div>
          <div class="fake-tower t1" data-n="12"></div>
          <div class="fake-tower t2" data-n="8"></div>
          <div class="fake-tower t3" data-n="15"></div>
          <div class="fake-tower t4" data-n="5"></div>
        </div>
        <div class="decree-overlay" role="dialog" aria-labelledby="decree-overlay-title" aria-modal="true">
          <section class="decree-overlay-card">
            <header class="decree-overlay-head">
              <span class="eyebrow">ПРАВО ЛИДЕРА</span>
              <h2 id="decree-overlay-title">Ваш указ · 30 секунд</h2>
              <span class="decree-overlay-timer">24.3 с</span>
            </header>
            <p class="decree-overlay-lead">
              Три готовых варианта с заранее показанным дополнительным
              эффектом. Можно выбрать сразу — печатать тему не нужно.
            </p>
            <div class="decree-candidates decree-candidates--overlay">
              <button type="button" class="decree-candidate">
                <b>Срочно увеличить гарнизон штаба</b>
                <small>Канцелярия нашла ещё один ящик касок.</small>
                <span>+24 бойцов штабу</span>
                <em>Случайный довесок уже определён: +8 бойцов штабу.</em>
              </button>
              <button type="button" class="decree-candidate">
                <b>Золотая лихорадка</b>
                <small>Казначейство торжественно трясёт копилкой.</small>
                <span>+36 золота</span>
                <em>Случайный довесок уже определён: щит штабу на 15 с.</em>
              </button>
              <button type="button" class="decree-candidate">
                <b>Инженерный перекур</b>
                <small>Инженеры вернулись с досками и непрошеными идеями.</small>
                <span>+36 древесины</span>
                <em>Случайный довесок уже определён: +12 древесины.</em>
              </button>
              <button type="button" class="decree-candidate decree-candidate--custom">
                <b>Написать свой приказ</b>
                <small>Только ваш штаб и ваша команда.</small>
                <span>Подкрепление, золото, древесина или щит.</span>
              </button>
            </div>
            <footer class="decree-overlay-foot">
              <span>Локальные варианты всегда доступны</span>
            </footer>
          </section>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
